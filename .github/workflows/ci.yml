name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        # setup-uv already provisions the venv (VIRTUAL_ENV is set); an explicit
        # `uv venv` here fails with "already exists" — do not add one back.
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Test
        run: .venv/bin/pytest -q
